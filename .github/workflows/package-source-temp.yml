name: Package source temp

on:
  push:
    branches:
      - feat/paysons-playback-performance

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r paysons-movies-latest.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x '.github/workflows/package-source-temp.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: paysons-movies-latest
          path: paysons-movies-latest.zip
          if-no-files-found: error
